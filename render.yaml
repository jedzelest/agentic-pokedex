# Render Blueprint: describes the web service so Render can set it up from the repo.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: agentic-pokedex
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agentic_pokedex.app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16" # matches the local version (uv run python --version)
      # Which LLM runs Rin: "openai" or "anthropic". To switch to Anthropic, set this to
      # "anthropic" and add ANTHROPIC_API_KEY (+ optionally ANTHROPIC_MODEL) in the dashboard.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      # Secrets: "sync: false" means Render asks you to type the value in the dashboard.
      # They are never stored in this file or in git.
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Supabase trainer journal (log_event tool). Without these, logging is switched off.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
