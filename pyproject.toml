[project]
name = "agentic-pokedex"
version = "0.1.0"
description = "Rin, an agentic Pokédex for Pokémon and PokeMMO"
readme = "README.md"
authors = [
    { name = "jedzelest", email = "jedzelestrelloso@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "gradio>=6.32.0",
    "openai>=3.52.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "supabase>=2.34.1",
]

[project.scripts]
agentic-pokedex = "agentic_pokedex:main"
pokedex-web = "agentic_pokedex.app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
